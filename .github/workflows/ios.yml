# iOS CI (ADR-003, ADR-006, build rule in CLAUDE.md).
# Every push: secret scan + compile-only build (all errors, full log as artifact) and the
# WidgetKitCore unit tests. With [full] or [ipa] in the head commit message: Simulator app and
# UI tests. With [ipa] only: the unsigned IPA. SwiftLint runs in parallel and never blocks.
# Docs-only commits skip the workflow; superseded runs are cancelled. A manual run takes
# mode "full" (app and UI tests, no IPA) or "ipa" (default: tests, then the IPA).
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = app and UI tests only; ipa = tests, then the IPA"
        type: choice
        options: [ipa, full]
        default: ipa

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  build:
    name: Compile (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        working-directory: .
        run: bash scripts/secret-scan.sh

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Localization check
        run: python3 scripts/check-strings.py

      - name: Generate project
        run: xcodegen generate --spec personal.yml

      - name: Build app, extension and test bundles (no tests)
        run: |
          mkdir -p build
          # Keep compiling other files after the first error so one run shows them all.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          status=0
          xcodebuild build-for-testing \
            -project WidgetStudio.xcodeproj -scheme WidgetStudio \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E '\*\* (TEST )?BUILD (SUCCEEDED|FAILED) \*\*' build/xcodebuild.log || tail -n 40 build/xcodebuild.log
          if [ "$status" -ne 0 ]; then
            echo "::group::All compiler errors (de-duplicated)"
            grep -E "error:" build/xcodebuild.log | sort -u
            echo "::endgroup::"
            exit "$status"
          fi

      # ADR-014: developer mode (configurable widget, own Apple account later) must keep
      # compiling; it is never shipped as an IPA from CI.
      - name: Build developer mode (WS_DEVELOPER)
        run: |
          status=0
          xcodebuild build \
            -project WidgetStudio.xcodeproj -scheme WidgetStudio \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataDeveloper \
            CODE_SIGNING_ALLOWED=NO WS_EXTRA_CONDITIONS=WS_DEVELOPER \
            > build/xcodebuild-developer.log 2>&1 || status=$?
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build/xcodebuild-developer.log || tail -n 40 build/xcodebuild-developer.log
          if [ "$status" -ne 0 ]; then
            echo "::group::All compiler errors in developer mode (de-duplicated)"
            grep -E "error:" build/xcodebuild-developer.log | sort -u
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild*.log
          retention-days: 7

  lint:
    name: SwiftLint (non-blocking)
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --quiet

  # Every push: package unit tests, in parallel with the compile job.
  unit:
    name: Unit tests (WidgetKitCore)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ios/WidgetKitCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/WidgetKitCore/Package.swift') }}

      - name: WidgetKitCore tests
        run: swift test --package-path WidgetKitCore

  # Build rule (CLAUDE.md): Simulator tests only with [full] or [ipa] in the head commit
  # message, or a manual run.
  test:
    name: App and UI tests (Simulator)
    needs: [build, unit]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[full]') ||
      contains(github.event.head_commit.message, '[ipa]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec personal.yml

      - name: App tests (renders, snapshots) and UI smoke test (Simulator)
        env:
          # Passed to the test process as SNAPSHOT_DIR (ADR-010).
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/ios/build/snapshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          xcodebuild test \
            -project WidgetStudio.xcodeproj -scheme WidgetStudio \
            -destination "id=$UDID" \
            -resultBundlePath build/TestResults.xcresult \
            -quiet

      - name: Test summary
        if: always()
        run: |
          [ -d build/TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --compact > build/summary.json
          python3 - <<'PY'
          import json
          s = json.load(open("build/summary.json"))
          print(f"App and UI tests: {s['passedTests']} passed, {s['failedTests']} failed, {s['skippedTests']} skipped of {s['totalTestCount']}")
          for f in s.get("testFailures", []):
              print(f"FAILED {f.get('testIdentifierString', f.get('testName'))}: {f.get('failureText')}")
          assert s["totalTestCount"] >= 7 and s["failedTests"] == 0, "expected at least 7 app and UI tests, none failing"
          PY

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ios/build/snapshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/build/TestResults.xcresult
          retention-days: 7

  # Build rule (CLAUDE.md): one IPA, only with [ipa] (or a manual run), after every test is green.
  ipa:
    name: Unsigned IPA
    needs: [build, unit, test]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'full') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ipa]'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec personal.yml

      - name: Build (unsigned, Release)
        run: |
          xcodebuild build \
            -project WidgetStudio.xcodeproj -scheme WidgetStudio \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet

      - name: Package IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/WidgetStudio.app
          bash scripts/build-ipa.sh "$APP" build/ipa/WidgetStudioP.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetStudioP-ipa
          path: ios/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
