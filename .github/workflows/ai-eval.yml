# AI eval (ADR-019): generates a widget for every image in docs/ai-eval with the real prompt,
# schema, parser and renderer, and uploads side-by-side images (original | render).
# Manual only. Uses the repository secret GEMINI_API_KEY, which is passed to the test process
# as an environment variable and never printed (GitHub also masks it in logs).
name: AI eval

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider (its key comes from the matching repository secret)"
        type: choice
        options: [gemini, nvidia, openrouter, groq]
        default: gemini
      model:
        description: "Model IDs, comma-separated (empty = the provider's default in the app)"
        type: string
        default: ""
      review:
        description: "High quality: add the self-review round"
        type: boolean
        default: false
      structured:
        description: "Start with the provider's structured output (off = prompt-only JSON mode)"
        type: boolean
        default: true
      cases:
        description: "Comma-separated image file names (empty = all)"
        type: string
        default: ""
      pause:
        description: "Seconds between requests (free tiers have per-minute limits)"
        type: string
        default: "8"

concurrency:
  group: ai-eval-${{ inputs.provider }}
  cancel-in-progress: true

jobs:
  eval:
    name: Generate and render
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret
        env:
          AI_EVAL_KEY: ${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API_KEY || inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || inputs.provider == 'groq' && secrets.GROQ_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$AI_EVAL_KEY" ]; then
            echo "::error::Add the repository secret for ${{ inputs.provider }} (GEMINI_API_KEY, NVIDIA_API_KEY, OPENROUTER_API_KEY or GROQ_API_KEY)."
            exit 1
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ios/WidgetKitCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/WidgetKitCore/Package.swift') }}

      - name: Run the eval
        env:
          AI_EVAL: "1"
          AI_EVAL_PROVIDER: ${{ inputs.provider }}
          AI_EVAL_KEY: ${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API_KEY || inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || inputs.provider == 'groq' && secrets.GROQ_API_KEY || secrets.GEMINI_API_KEY }}
          AI_EVAL_DIR: ${{ github.workspace }}/docs/ai-eval
          AI_EVAL_OUT: ${{ github.workspace }}/ai-eval-out
          AI_EVAL_FONTS: ${{ github.workspace }}/ios/Fonts
          AI_EVAL_MODEL: ${{ inputs.model }}
          AI_EVAL_REVIEW: ${{ inputs.review && '1' || '0' }}
          AI_EVAL_CASES: ${{ inputs.cases }}
          AI_EVAL_STRUCTURED: ${{ inputs.structured && '1' || '0' }}
          AI_EVAL_PAUSE: ${{ inputs.pause }}
        run: swift test --package-path ios/WidgetKitCore --filter AIEvalTests

      - name: Summary
        if: always()
        run: |
          [ -f ai-eval-out/summary.md ] && cat ai-eval-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval
          path: ai-eval-out
          if-no-files-found: warn
          retention-days: 14
